name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit tests (${{ matrix.os }})
    if: github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15

    steps:
      - name: Check out pull request
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcli11-dev libopencv-dev libsqlite3-dev libzip-dev ninja-build nlohmann-json3-dev zipcmp zipmerge ziptool
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install --classic blake3:x64-linux

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"
          brew install blake3 cli11 libzip nlohmann-json opencv@4 whisper-cpp

      - name: Configure Linux unit tests
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBLAKE3_INCLUDE_DIR="$VCPKG_INSTALLATION_ROOT/installed/x64-linux/include"
          -DBLAKE3_LIBRARY="$VCPKG_INSTALLATION_ROOT/installed/x64-linux/lib/libblake3.a"

      - name: Configure macOS unit tests
        if: runner.os == 'macOS'
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$(brew --prefix);$(brew --prefix opencv@4)"

      - name: Build unit tests
        run: cmake --build build/ci --parallel

      - name: Run unit tests
        env:
          SVP_MODEL_CACHE_DIR: ""
          SVP_MODEL_CACHE_ROOT: ""
        run: ctest --test-dir build/ci --output-on-failure
